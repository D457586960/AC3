<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main>
        <h1>Formulari de registre</h1>
        <p class="introduccio">
            Omple el formulari per registrar-te a l'activitat.
        </p>

        <form action="https://m0373ac3.free.nf/processa.php" method="get">
            <!-- TODOS LOS ELEMENTOS DEL FORMULrio AQUÍ DENTRO -->

            <fieldset>
                <legend>Dades personals</legend>
                <label for="nom">Nom:</label>
                <input type="text" id="nom" name="nom" required>

                <label for="apellido">Apellido:</label>
                <input type="text" id="apellido" name="nom" required>


                <label for="correo">Correo:</label>
                <input type="email" id="correo electrònico" name="correo" required>

                <label for="Contraseña">contraseña:</label>
                <input type="password" id="Contraseña" name="contrasena" required>

                <label for="edad">Edad</label>
                <input type="number" id="Edad" name="edad" required min="14" max="100">
                  

                <label for="fecha de nacimiento">fecha de nacimiento</label>
                <input type="text" id="Fecha" name="fecha de naciemiento" required>

                <label for="telefono">telèfono:</label>
                <input type="tel" id="Telèfono" name="telefono" required>

                <label for="pagina web">Pàgina Web:</label>
                <input type="url" id="Web" name="pagina" required>
            </fieldset>
            <fieldset> 
                <legend>preferencias</legend>

              <label for="color preferido">color preferido:</label>
            <input type="color" id="color" name="color preferido">
            
            <label for="rango">que tanto te gusta programar:</label>
            <input  type="range" id="que tanto te gusta programar " name="range" min="5" max="10">
            
            <label for="radio">Home:</label>
            <input  type="radio" id="hombre" name="genero" value="Home"  >

            <label for="radio">Dona:</label>
           <input  type="radio" id="mujer" name="genero" value="mujer" >

            <label for="radio">Altres:</label>
            <input  type="radio" id="otro" name="genero" value="Altres">
            <h3>aficiones</h3>

           <label for="programacion">programacion:</label>
            <input  type="checkbox" id="programacion" name="aficiones" value="programacion">
          
           <label for="videojuegos">videojuegos:</label>
            <input  type="checkbox" id="videojuegos" name="aficiones" value="videojuegos">

            <label for="deporte">deporte:</label>
            <input  type="checkbox" id="deporte" name="aficiones" value="deporte">

            <label for="musica">musica:</label>
            <input  type="checkbox" id="musica" name="aficiones" value="musica">
            </fieldset>
            <fieldset>
            <legend>Llocalizacion</legend>
 
           <label for="pais">pais</label>
           <select name="pais" id="pais">
            <option value="españa">españa</option>
            <option value="francia">francia</option>
            <option value="italia">italia</option>
            <option value="portugal">portugal</option>
            <option value="alemania">alemania</option>
             <option value="reino unido">reino unido</option>
            </option>
           
             <label for="municipio">municipio:</label>
            <input  type="" id="municipio" name="municipio">
            </fieldset>
            <fieldset>
           <legend>informacion addicional</legend>

            <label for="comentario">comentario:</label>
            <input  type="text" id="comentario" name="comentario" >

             <label for="fichero">fichero:</label>
            <input  type="file" id="municipio" name="fichero">

             <label for="aceptacion de las condiciones">aceptacion:</label>
            <input  type="checkbox" id="aceptacion" name="aceptacion" required>
       </fieldset>

            <input type="submit">
            <input type="reset" value="Netejar">
        </form>
    </main>
</body>

</html>
